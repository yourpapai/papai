# Bun configuration file
# https://bun.com/docs/runtime/bunfig

[test]
# Exclude E2E, client, and hermetic story tests from default test discovery
# E2E tests require Docker setup; run with: bun test:e2e
# Client tests require happy-dom DOM environment; run with: bun test:client
pathIgnorePatterns = ["tests/e2e/**", "tests/client/**", "tests/visual/**", "tests/stories/**"]

# Per-test timeout (default 5000ms). The default suite runs with `--parallel`
# (one worker process per file = CPU-core count). Under that load the event
# loop in a starved worker can stretch a normally-sub-second test past 5s and
# fail it as a false flake. 15s absorbs scheduling jitter while still failing a
# genuine hang (which would otherwise run unbounded). Override per-call with
# `--timeout`, or per-test via the third arg to `test()`/`it()`.
timeout = 15000

# Preload global setup (server-side tests only)
preload = ["./tests/setup.ts", "./tests/mock-reset.ts"]

# Coverage reporting only — the floor is NOT enforced here. bun's
# `coverageThreshold` is a per-file rule (every file must individually clear the
# bar), which cannot express the aggregate floor this repo gates on; measured on
# bun 1.3.13, a threshold above the worst file fails even when the pooled and
# mean totals both clear it. The floor lives in scripts/coverage/ratchet.ts and
# is enforced by scripts/check.sh after the CI coverage run.
# Not `coverage = true`: coverage stays opt-in so the stories/e2e/smoke/client
# runs and local `--parallel` checks are unaffected.
coverageReporter = ["text", "lcov"]
coverageDir = "reports/coverage"
