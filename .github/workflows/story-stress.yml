name: Story Stress

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

jobs:
  build:
    name: Build story runtime
    runs-on: ubuntu-24.04
    # Install and a client build, nothing else. Mirrors CI's `build` guard.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build client
        run: bun build:client
      - name: Upload build output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-output
          path: public/
          retention-days: 1

  stress:
    name: Sandboxed story stress
    needs: build
    runs-on: ubuntu-24.04
    # Repeated story runs against the sandbox, so deliberately the loosest guard
    # of the two: this job is *meant* to take a long time, and the thing being
    # guarded against is a sandbox container that stops answering mid-repeat.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Download build output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-output
          path: public/
      - name: Verify Linux story sandbox
        run: |
          docker version
          bash scripts/ci/pull-story-sandbox-image.sh
          docker run --rm --network none "$(cat scripts/story/sandbox-image.txt)" --version
      - name: Run sandboxed story stress
        env:
          PAPAI_REQUIRE_STORY_SANDBOX: '1'
        run: bun test:stories:stress
      - name: Upload story reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sandboxed-story-stress-reports
          path: reports/stories/**
          if-no-files-found: warn
          retention-days: 14
