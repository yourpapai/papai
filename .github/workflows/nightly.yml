name: Nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  platform:
    name: T3 Platform-Adapter Lane
    runs-on: ubuntu-latest
    # Backstop for a hung container or an unreachable host fake. The lane is two full
    # boots. Replace this value with the measured lane time (rounded up to ~2x) after
    # the first green nightly run, matching the T2 smoke job's methodology.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Set up Docker
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver: docker
      - name: Install dependencies
        run: bun install
      - name: Build papai:e2e image
        run: docker build -t papai:e2e .
      - name: Run T3 platform lane
        # host.docker.internal resolves via --add-host (set by the harness).
        timeout-minutes: 6
        run: bun run test:platform
      - name: Upload platform reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-adapter-reports
          path: reports/platform/**
          if-no-files-found: warn
          retention-days: 14

  # Non-gating canary: the repo typechecks with a caret `typescript` range, so
  # upstream drift surfaces here on a schedule instead of mid-PR. Replaces the
  # compiler with the latest release in an isolated install, then typechecks and
  # smoke-runs plugin discovery (the oxc-based parser must keep loading).
  typescript-canary:
    name: TypeScript latest canary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Override typescript to latest
        run: bun add -d typescript@latest
      - name: Typecheck
        run: bun run typecheck
      - name: Discovery smoke
        run: bun -e "const { discoverPlugins } = await import('./src/plugins/discovery.js'); const r = await discoverPlugins('plugins'); if (r.directoryMissing || r.errors.length > 0) { console.error(r); process.exit(1) }; console.log('discovered', r.plugins.length, 'plugins')"
