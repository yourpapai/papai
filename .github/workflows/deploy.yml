name: Deploy

on:
  push:
    tags: ['v*.*.*']
  workflow_run:
    workflows: ['Release']
    types: [completed]
    branches: [master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.push.outputs.digest }}
      image_name: ${{ steps.lowercase.outputs.image_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Lowercase image name
        id: lowercase
        run: |
          echo "image_name=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    needs: build-and-push
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST_KEY: ${{ secrets.SSH_HOST_KEY }}
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
          SSH_USER: ${{ vars.SSH_USER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
          IMAGE: ${{ env.REGISTRY }}/${{ needs.build-and-push.outputs.image_name }}@${{ needs.build-and-push.outputs.digest }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          KANEO_POSTGRES_PASSWORD: ${{ secrets.KANEO_POSTGRES_PASSWORD }}
          KANEO_AUTH_SECRET: ${{ secrets.KANEO_AUTH_SECRET }}
          KANEO_CLIENT_URL: ${{ vars.KANEO_CLIENT_URL }}
          INSTANCE_CONFIG_KEY: ${{ secrets.INSTANCE_CONFIG_KEY }}
          SETTINGS_PUBLIC_BASE_URL: ${{ vars.SETTINGS_PUBLIC_BASE_URL }}
          DEBUG_SERVER: ${{ vars.DEBUG_SERVER || 'false' }}
          DEBUG_TOKEN: ${{ secrets.DEBUG_TOKEN }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL || 'info' }}
          DEMO_MODE: ${{ vars.DEMO_MODE || 'false' }}
          CADDY_ADDITIONAL_CONFIG: ${{ vars.CADDY_ADDITIONAL_CONFIG }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          MAIN_MODEL: ${{ vars.MAIN_MODEL }}
          SMALL_MODEL: ${{ vars.SMALL_MODEL }}
          EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          trap 'rm -f ~/.ssh/id_rsa' EXIT
          printf '%s\n' "$SSH_HOST_KEY" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_rsa -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" mkdir -p "~/${GITHUB_REPOSITORY##*/}"
          scp -i ~/.ssh/id_rsa -P "$SSH_PORT" docker-compose.yml "$SSH_USER@$SSH_HOST:~/${GITHUB_REPOSITORY##*/}/docker-compose.yml"
          scp -i ~/.ssh/id_rsa -P "$SSH_PORT" Caddyfile "$SSH_USER@$SSH_HOST:~/${GITHUB_REPOSITORY##*/}/Caddyfile"
          if [ -n "$CADDY_ADDITIONAL_CONFIG" ]; then
            printf '%s\n' "$CADDY_ADDITIONAL_CONFIG" > /tmp/caddy-extra.conf
            scp -i ~/.ssh/id_rsa -P "$SSH_PORT" /tmp/caddy-extra.conf "$SSH_USER@$SSH_HOST:~/${GITHUB_REPOSITORY##*/}/caddy-extra.conf"
            rm -f /tmp/caddy-extra.conf
          fi
          ssh -i ~/.ssh/id_rsa -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" bash << EOF
          set -e
          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
          cd ~/${GITHUB_REPOSITORY##*/}
          {
            printf 'CHAT_PROVIDER=telegram\n'
            printf 'TELEGRAM_BOT_TOKEN=%s\n' "${TELEGRAM_BOT_TOKEN}"
            printf 'ADMIN_USER_ID=%s\n' "${ADMIN_USER_ID}"
            [ -n "${INSTANCE_CONFIG_KEY}" ] && printf 'INSTANCE_CONFIG_KEY=%s\n' "${INSTANCE_CONFIG_KEY}"
            [ -n "${SETTINGS_PUBLIC_BASE_URL}" ] && printf 'SETTINGS_PUBLIC_BASE_URL=%s\n' "${SETTINGS_PUBLIC_BASE_URL}"
            printf 'KANEO_POSTGRES_PASSWORD=%s\n' "${KANEO_POSTGRES_PASSWORD}"
            printf 'KANEO_AUTH_SECRET=%s\n' "${KANEO_AUTH_SECRET}"
            [ -n "${KANEO_CLIENT_URL}" ] && printf 'KANEO_CLIENT_URL=%s\n' "${KANEO_CLIENT_URL}"
            printf 'DEBUG_SERVER=%s\n' "${DEBUG_SERVER}"
            [ "${DEBUG_SERVER}" = "true" ] && printf 'DEBUG_HOSTNAME=0.0.0.0\n'
            [ -n "${DEBUG_TOKEN}" ] && printf 'DEBUG_TOKEN=%s\n' "${DEBUG_TOKEN}"
            printf 'LOG_LEVEL=%s\n' "${LOG_LEVEL}"
            [ "${DEMO_MODE}" = "true" ] && printf 'DEMO_MODE=true\n'
            [ -n "${S3_BUCKET}" ] && printf 'S3_BUCKET=%s\n' "${S3_BUCKET}"
            [ -n "${S3_ENDPOINT}" ] && printf 'S3_ENDPOINT=%s\n' "${S3_ENDPOINT}"
            [ -n "${S3_ACCESS_KEY_ID}" ] && printf 'S3_ACCESS_KEY_ID=%s\n' "${S3_ACCESS_KEY_ID}"
            [ -n "${S3_SECRET_ACCESS_KEY}" ] && printf 'S3_SECRET_ACCESS_KEY=%s\n' "${S3_SECRET_ACCESS_KEY}"
            [ -n "${LLM_API_KEY}" ] && printf 'LLM_API_KEY=%s\n' "${LLM_API_KEY}"
            [ -n "${LLM_BASE_URL}" ] && printf 'LLM_BASE_URL=%s\n' "${LLM_BASE_URL}"
            [ -n "${MAIN_MODEL}" ] && printf 'MAIN_MODEL=%s\n' "${MAIN_MODEL}"
            [ -n "${SMALL_MODEL}" ] && printf 'SMALL_MODEL=%s\n' "${SMALL_MODEL}"
            [ -n "${EMBEDDING_MODEL}" ] && printf 'EMBEDDING_MODEL=%s\n' "${EMBEDDING_MODEL}"
          } > .env
          chmod 600 .env

          # Append additional Caddy config if transferred
          if [ -f caddy-extra.conf ]; then
            printf '\n' >> Caddyfile
            cat caddy-extra.conf >> Caddyfile
            rm -f caddy-extra.conf
          fi

          # Backup database before deployment
          echo "Creating database backup..."
          backup_dir="backups"
          mkdir -p "\$backup_dir"
          backup_file="papai-\$(date +%Y%m%d_%H%M%S).db"

          # Check if papai is running and backup the database
          if docker compose ps papai | grep -q "running"; then
            docker compose cp papai:/data/papai.db "\$backup_dir/\$backup_file" 2>/dev/null || echo "Note: Could not backup database (may not exist yet)"
            if [ -f "\$backup_dir/\$backup_file" ]; then
              echo "Database backed up to: \$backup_dir/\$backup_file"
              # Keep only last 5 backups
              ls -t "\$backup_dir"/papai-*.db 2>/dev/null | tail -n +6 | xargs -r rm
              echo "Kept last 5 backups, removed older ones"
            fi
          else
            echo "Note: papai container not running, skipping backup"
          fi

          IMAGE="${IMAGE}" docker compose pull
          docker compose down --remove-orphans
          IMAGE="${IMAGE}" docker compose up -d
          docker image prune -f
          echo "Waiting for services to become healthy..."
          for i in \$(seq 1 18); do
            status=\$(docker inspect \$(docker compose ps -q kaneo 2>/dev/null) --format '{{.State.Health.Status}}' 2>/dev/null || echo unknown)
            if [ "\$status" = "healthy" ]; then
              echo "kaneo is healthy"
              break
            fi
            if [ "\$i" -eq 18 ]; then
              echo "Health check timed out after 3 minutes" >&2
              docker compose ps >&2
              docker compose logs --tail=50 kaneo >&2
              exit 1
            fi
            echo "  kaneo status: \$status (\$i/18, waiting 10s...)"
            sleep 10
          done
          docker compose ps papai | grep -qiE "running|up" || {
            echo "papai is not running" >&2
            docker compose ps >&2
            docker compose logs --tail=50 papai >&2
            exit 1
          }
          echo "All services healthy"
          EOF
