name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Install dependencies
        run: bun install
      - name: Build client
        run: bun build:client
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: papai:ci-build-${{ github.sha }}
      - name: Smoke-test the freshly built image
        env:
          IMAGE_TAG: papai:ci-build-${{ github.sha }}
          ADMIN_USER_ID: 'smoke-admin'
          STARTUP_DEADLINE_SECONDS: '15'
        run: bash scripts/ci/docker-smoke-test.sh
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: public/
          retention-days: 1

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install dependencies
        run: bun install
      - name: Run security scan
        run: bun security
      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('semgrep-results.sarif') != ''
        with:
          sarif_file: semgrep-results.sarif

  check:
    name: Checks
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install dependencies
        run: bun install
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: public/
      - name: Run all checks
        run: bun check:full

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Set up Docker
        uses: docker/setup-buildx-action@v3
      - name: Install dependencies
        run: bun install
      - name: Create env file
        run: |
          echo "KANEO_POSTGRES_PASSWORD=test-password" >> .env
          echo "KANEO_AUTH_SECRET=test-auth-secret-for-ci-environment" >> .env
          echo "KANEO_CLIENT_URL=http://localhost:11337" >> .env
      - name: Run E2E tests
        run: bun test:e2e
        env:
          E2E_KANEO_URL: http://localhost:11337

  mutation-testing:
    name: Mutation Testing (paired, changed files)
    runs-on: ubuntu-latest
    # Temporarily disabled while the paired mutation runner is calibrated.
    # Re-enable with: if: ${{ github.event_name == 'pull_request' }}
    if: ${{ false }}
    # Warn-only during calibration. Flip continue-on-error to false once we
    # have a stable score floor (see spec §5).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # paired runner needs the base branch to diff against
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run paired mutation testing on changed files
        env:
          BASE_REF: ${{ github.base_ref || 'master' }}
        run: bun test:mutate:changed --base="origin/$BASE_REF"
      - name: Upload per-file mutation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-paired-reports
          path: reports/paired/
          if-no-files-found: ignore
          retention-days: 14
