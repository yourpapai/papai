name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    # Runaway guard, not a budget. A job with no `timeout-minutes` inherits
    # GitHub's own 360-minute ceiling, so a stalled `docker build` layer pull
    # holds a concurrency slot for six hours and the run reports nothing until
    # it does. Observed 69s on 2026-08-13; every value in this file is that
    # measurement rounded up hard, deliberately loose enough that a slow runner
    # is never what turns the build red.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          # Use the host docker driver so the smoke test's `docker image inspect`
          # and `docker run` see the image that the build step produces. The
          # default `docker-container` driver builds into an isolated builder
          # that's invisible to plain `docker` commands.
          driver: docker
      - name: Install dependencies
        run: bun install
      - name: Build client
        run: bun build:client
      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          tags: papai:ci-build-${{ github.sha }}
      - name: Smoke-test the freshly built image
        env:
          IMAGE_TAG: papai:ci-build-${{ github.sha }}
          ADMIN_USER_ID: 'smoke-admin'
          STARTUP_DEADLINE_SECONDS: '15'
        run: bash scripts/ci/docker-smoke-test.sh
      - name: Upload build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-output
          path: public/
          retention-days: 1

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    # Observed 65s. Semgrep's rule download is the part that can hang.
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - name: Install dependencies
        run: bun install
      - name: Run security scan
        run: bun security:ci
      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        if: always() && hashFiles('semgrep-results.sarif') != ''
        with:
          sarif_file: semgrep-results.sarif

  # Deliberately `needs`-free and dependency-free: it is the one check whose
  # subject is the workflow files themselves, and an invalid one is invisible
  # everywhere else. GitHub rejects the file rather than failing a job, so no
  # build goes red — agent-pipeline.yml sat broken from 2026-08-09 to
  # 2026-08-12 with CI green over it. Running before `build` makes that the
  # first thing the run says rather than the last.
  workflows:
    name: Workflow Lint
    runs-on: ubuntu-latest
    # Observed 11s. The only slow path is the pinned actionlint download.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      # No `bun install`: the runner script imports nothing outside Bun's own
      # builtins, and the linter it fetches is a pinned, checksum-verified
      # release binary.
      - name: Lint workflow files
        run: bun workflows:lint

  check:
    name: Checks
    needs: build
    runs-on: ubuntu-latest
    # Observed 3m03s; CLAUDE.md budgets the serial suite at ~3-4 min plus ~65s of
    # lint/typecheck/knip/format. Loose enough that a single pathologically slow
    # test file is a slow build rather than a red one — the perf budgets this job
    # enables (PAPAI_PERF_BUDGETS) are what fail on real timing regressions.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - name: Install dependencies
        run: bun install
      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output
          path: public/
      - name: Run all checks
        env:
          # Enforce wall-clock perf budgets here: this job runs the suite serially, so
          # the timing assertions are not subject to parallel-worker CPU contention.
          PAPAI_PERF_BUDGETS: '1'
        run: bun check:full
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: reports/coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

  stories:
    name: Hermetic Full-Stack Stories
    needs: build
    runs-on: ubuntu-24.04
    # Observed 2m52s. The sandbox image pull is the unbounded part — a registry
    # stall is exactly the failure this guard is for.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output
          path: public/
      - name: Verify Linux story sandbox
        run: |
          docker version
          image="$(cat scripts/story/sandbox-image.txt)"
          docker pull "$image"
          docker run --rm --network none "$image" --version
      - name: Prove process sandbox boundary
        env:
          PAPAI_REQUIRE_STORY_SANDBOX: '1'
        run: bun test --path-ignore-patterns '' tests/stories/sandbox/process-boundary.test.ts
      - name: Run hermetic harness contracts
        env:
          PAPAI_REQUIRE_STORY_SANDBOX: '1'
        run: bun test:stories:contracts --reporter=junit --reporter-outfile=reports/stories/contracts-junit.xml
      - name: Run hermetic full-stack stories
        env:
          PAPAI_REQUIRE_STORY_SANDBOX: '1'
        run: bun test:stories:coverage
      - name: Upload story reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hermetic-story-reports
          path: reports/stories/**
          if-no-files-found: warn
          retention-days: 14

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    # Backstop for a hung Kaneo container or a runaway provider-real lane. The whole
    # job (install + Docker + Kaneo bring-up + 66 tests) has been observed at ~62s on
    # an isolated runner; 12m is a generous runaway guard, not a tight budget.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - name: Set up Docker
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Install dependencies
        run: bun install
      - name: Create env file
        run: |
          echo "KANEO_POSTGRES_PASSWORD=test-password" >> .env
          echo "KANEO_AUTH_SECRET=test-auth-secret-for-ci-environment" >> .env
          echo "KANEO_CLIENT_URL=http://localhost:11337" >> .env
      - name: Run E2E tests
        # Enforces Tier 1's declared wall-clock budget (Rule 5): the provider-real lane
        # has a 132s ceiling (baseline ~42s; ~62s observed on this runner). 6m bounds the
        # lane at well under 3x the ceiling so a genuine blow-up fails CI instead of
        # silently regressing, while leaving ample headroom for runner jitter and image pulls.
        timeout-minutes: 6
        run: bun test:e2e
        env:
          E2E_KANEO_URL: http://localhost:11337

  smoke:
    name: T2 Process-Real Smoke
    runs-on: ubuntu-latest
    # Backstop for a hung container or an unreachable host fake. The lane is two full
    # boots + one fast-fail; replace the value below only if the runaway guard proves
    # too tight after measurement (Step 2).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - name: Set up Docker
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver: docker
      - name: Install dependencies
        run: bun install
      - name: Build papai:e2e image
        run: docker build -t papai:e2e .
      - name: Run T2 smoke lane
        # Enforces the T2 measured wall-clock budget (Rule 5). The value below is the
        # measured lane time rounded up to ~2x headroom (see Step 2); it is a real
        # measurement, not a guess. host.docker.internal resolves via --add-host
        # (--add-host=host.docker.internal:host-gateway is set by the harness).
        timeout-minutes: 3
        run: bun run test:smoke

  mutation-testing:
    name: Mutation Testing (paired, changed files)
    runs-on: ubuntu-latest
    # The loosest guard in this file, and the one that most needed a guard at all:
    # this was the longest unbounded job in CI, observed at 39m13s on a large PR
    # against 21s on a one-file merge. Runtime scales with the changed-file count,
    # so the value is sized off the worst run seen rather than the median — tight
    # enough that a wedged Stryker worker pool cannot sit for six hours, loose
    # enough that a genuinely large PR is not failed for being large.
    #
    # Carried-over scores make the typical push far cheaper, but they do not lower this
    # ceiling: a cold cache (first push, evicted entry, changed toolchain) still measures
    # every file in the branch diff, so the worst case is unchanged and so is the bound.
    timeout-minutes: 90
    # Blocking PR gate. A changed file fails only if it has a recorded baseline
    # entry in scripts/mutation/baseline.json and drops below it. Files new to
    # scope (first-touch) warn and are seeded by the master mutation-baseline job.
    #
    # The gate judges the WHOLE branch diff on every run, but measures only the files whose
    # content changed since the previous run — the rest carry over scores recorded earlier on
    # this branch. So a drop introduced in one commit keeps failing later pushes that touch
    # nothing near it, which is the property the cache steps below exist to preserve.
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # paired runner needs the base branch to diff against
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # The key only decides WHICH blob to fetch. Every entry inside it is guarded by a
      # content fingerprint at read time, so restoring an older, racing, or unrelated cache
      # can only cost runtime — it can never let a stale score into the verdict. Cache
      # entries are immutable per key, hence unique-key-write plus prefix-restore; run_id
      # keeps the key unique even when the same sha is re-run.
      - name: Restore carried-over mutation scores
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            reports/paired/score-cache.json
            reports/paired/coverage-map.cache.json
          key: mutation-scores-v1-${{ github.event.pull_request.number }}-${{ github.sha }}-${{ github.run_id }}
          restore-keys: mutation-scores-v1-${{ github.event.pull_request.number }}-
      - name: Run paired mutation testing on changed files
        env:
          BASE_REF: ${{ github.base_ref || 'master' }}
        run: bun test:mutate:changed --base="origin/$BASE_REF"
      - name: Save carried-over mutation scores
        # `always()` is load-bearing, not hygiene. A FAILING run must still persist the scores
        # it measured: otherwise the next push re-measures the regressed file from scratch and
        # the gate forgets the drop that made this run red, which is the one thing incremental
        # measurement must never do. `continue-on-error` covers fork PRs, whose read-only token
        # cannot write a cache — a save that fails must never turn a green gate red.
        if: always()
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            reports/paired/score-cache.json
            reports/paired/coverage-map.cache.json
          key: mutation-scores-v1-${{ github.event.pull_request.number }}-${{ github.sha }}-${{ github.run_id }}
      - name: Upload per-file mutation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-paired-reports
          path: reports/paired/
          if-no-files-found: ignore
          retention-days: 14

  mutation-baseline:
    name: Mutation Testing (changed-files baseline seed)
    runs-on: ubuntu-latest
    # Same tool and the same variance as the paired gate above, so the same value.
    # It matters more here than the runtime suggests: `queue: max` keeps every
    # merge's seed alive, so one wedged job at the six-hour ceiling stalls the
    # baseline queue behind it rather than just losing its own slot.
    timeout-minutes: 90
    # Serialize baseline seeds across CI runs. queue: max keeps every merge's job
    # alive: the default (single) lets a newer run cancel a pending one, which
    # would silently lose that merge's seed. Group is workflow-scoped because
    # concurrency groups are shared across all workflows in the repo.
    concurrency:
      group: ${{ github.workflow }}-mutation-baseline
      queue: max
    # On master merge: seed scripts/mutation/baseline.json with mutation scores for
    # changed files (broad scope) using seedMerge; existing entries are preserved
    # (per-key max), and first-touch files get seeded after merge. The committed
    # baseline is the floor the PR gate enforces.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # changed-files runner needs HEAD~1 (previous master) to diff against
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Seed baseline from changed files since previous master
        run: bun test:mutate:changed --base=HEAD~1 --update-baseline
      - name: Commit ratcheted baseline
        env:
          RUN_SHA: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Master can move while mutation testing runs (e.g. a release bump push),
          # which rejects a naive push and loses the seed. Instead regenerate the
          # commit from the persisted scores on top of the fresh remote tip on every
          # attempt: seedMerge is per-key max, so retries never conflict and never
          # lose entries from concurrent seeds. --fresh-base drops scores for files
          # that changed on master since this run's checkout.
          for attempt in 1 2 3 4 5; do
            git fetch origin master
            git reset --hard origin/master
            bun test:mutate:seed --scores=reports/paired/scores.json --fresh-base="$RUN_SHA"
            if git diff --quiet scripts/mutation/baseline.json; then
              echo "No baseline change; nothing to commit."
              exit 0
            fi
            git add scripts/mutation/baseline.json
            git commit -m "chore(mutation): ratchet baseline"
            if git push; then
              exit 0
            fi
            echo "Push rejected because master moved; re-seeding on fresh master (attempt $attempt)."
          done
          echo "Failed to push ratcheted baseline after 5 attempts."
          exit 1
      - name: Upload changed-files mutation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-changed-files-reports
          path: reports/paired/
          if-no-files-found: ignore
          retention-days: 30
