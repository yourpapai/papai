name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    # Runaway guard, not a budget. A job with no `timeout-minutes` inherits
    # GitHub's own 360-minute ceiling, so a stalled `docker build` layer pull
    # holds a concurrency slot for six hours and the run reports nothing until
    # it does. Observed 69s on 2026-08-13; every value in this file is that
    # measurement rounded up hard, deliberately loose enough that a slow runner
    # is never what turns the build red.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          # Use the host docker driver so the smoke test's `docker image inspect`
          # and `docker run` see the image that the build step produces. The
          # default `docker-container` driver builds into an isolated builder
          # that's invisible to plain `docker` commands.
          driver: docker
      - name: Install dependencies
        run: bun install
      - name: Build client
        run: bun build:client
      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          tags: papai:ci-build-${{ github.sha }}
      - name: Smoke-test the freshly built image
        env:
          IMAGE_TAG: papai:ci-build-${{ github.sha }}
          ADMIN_USER_ID: 'smoke-admin'
          STARTUP_DEADLINE_SECONDS: '15'
        run: bash scripts/ci/docker-smoke-test.sh
      - name: Upload build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-output
          path: public/
          retention-days: 1

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    # Observed 65s. Semgrep's rule download is the part that can hang.
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install
      - name: Run security scan
        run: bun security:ci
      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        if: always() && hashFiles('semgrep-results.sarif') != ''
        with:
          sarif_file: semgrep-results.sarif

  # Deliberately `needs`-free and dependency-free: it is the one check whose
  # subject is the workflow files themselves, and an invalid one is invisible
  # everywhere else. GitHub rejects the file rather than failing a job, so no
  # build goes red — agent-pipeline.yml sat broken from 2026-08-09 to
  # 2026-08-12 with CI green over it. Running before `build` makes that the
  # first thing the run says rather than the last.
  workflows:
    name: Workflow Lint
    runs-on: ubuntu-latest
    # Observed 11s. The only slow path is the pinned actionlint download.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      # No `bun install`: the runner script imports nothing outside Bun's own
      # builtins, and the linter it fetches is a pinned, checksum-verified
      # release binary.
      - name: Lint workflow files
        run: bun workflows:lint

  check:
    name: Checks
    needs: build
    runs-on: ubuntu-latest
    # Observed 3m03s; CLAUDE.md budgets the serial suite at ~3-4 min plus ~65s of
    # lint/typecheck/knip/format. Loose enough that a single pathologically slow
    # test file is a slow build rather than a red one — the perf budgets this job
    # enables (PAPAI_PERF_BUDGETS) are what fail on real timing regressions.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install
      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output
          path: public/
      # The suite this job runs includes the Docker-backed story-sandbox boundary
      # tests, and `CI` is what makes them mandatory rather than skippable (see
      # `isLinuxStorySandboxRequired` in scripts/story/sandbox.ts). Nothing else
      # in this job speaks to Docker, so without this the first `docker run`
      # inside a test is also the first registry pull — which is how run
      # 31932802512 turned an anonymous-pull rejection into a failed boundary
      # assertion. Warm it here, retried, where a registry problem reads as one.
      - name: Warm the story sandbox image
        run: bash scripts/ci/pull-story-sandbox-image.sh
      - name: Run all checks
        env:
          # Enforce wall-clock perf budgets here: this job runs the suite serially, so
          # the timing assertions are not subject to parallel-worker CPU contention.
          PAPAI_PERF_BUDGETS: '1'
        run: bun check:full
      # check.sh persists every check's full output to reports/checks/<name>.log,
      # but its failure `cat` dies on EAGAIN partway through a ~20k-line test log
      # (run 33153391880: only the first ~800 lines reached the job log, and the
      # files died with the runner). Upload them so a red Checks job is diagnosable
      # from artifacts alone. `always()`, not `failure()`: a green run's test.log
      # also carries CI-side per-test timings the streamed output does not.
      - name: Upload check logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checks-logs
          path: reports/checks/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: reports/coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

  stories:
    name: Hermetic Full-Stack Stories
    needs: build
    runs-on: ubuntu-24.04
    # Observed 2m52s. The sandbox image pull is the unbounded part — a registry
    # stall is exactly the failure this guard is for.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output
          path: public/
      - name: Verify Linux story sandbox
        run: |
          docker version
          bash scripts/ci/pull-story-sandbox-image.sh
          docker run --rm --network none "$(cat scripts/story/sandbox-image.txt)" --version
      - name: Prove process sandbox boundary
        env:
          PAPAI_REQUIRE_STORY_SANDBOX: '1'
        run: bun test --path-ignore-patterns '' tests/stories/sandbox/process-boundary.test.ts
      - name: Run hermetic harness contracts
        env:
          PAPAI_REQUIRE_STORY_SANDBOX: '1'
        run: bun test:stories:contracts --reporter=junit --reporter-outfile=reports/stories/contracts-junit.xml
      - name: Run hermetic full-stack stories
        env:
          PAPAI_REQUIRE_STORY_SANDBOX: '1'
        run: bun test:stories:coverage
      - name: Upload story reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hermetic-story-reports
          path: reports/stories/**
          if-no-files-found: warn
          retention-days: 14

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    # Backstop for a hung Kaneo container or a runaway provider-real lane. The whole
    # job (install + Docker + Kaneo bring-up + 66 tests) has been observed at ~62s on
    # an isolated runner; 12m is a generous runaway guard, not a tight budget.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Set up Docker
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Install dependencies
        run: bun install
      - name: Create env file
        run: |
          echo "KANEO_POSTGRES_PASSWORD=test-password" >> .env
          echo "KANEO_AUTH_SECRET=test-auth-secret-for-ci-environment" >> .env
          echo "KANEO_CLIENT_URL=http://localhost:11337" >> .env
      - name: Run E2E tests
        # Enforces Tier 1's declared wall-clock budget (Rule 5): the provider-real lane
        # has a 132s ceiling (baseline ~42s; ~62s observed on this runner). 6m bounds the
        # lane at well under 3x the ceiling so a genuine blow-up fails CI instead of
        # silently regressing, while leaving ample headroom for runner jitter and image pulls.
        timeout-minutes: 6
        run: bun test:e2e
        env:
          E2E_KANEO_URL: http://localhost:11337

  smoke:
    name: T2 Process-Real Smoke
    runs-on: ubuntu-latest
    # Backstop for a hung container or an unreachable host fake. The lane is two full
    # boots + one fast-fail; replace the value below only if the runaway guard proves
    # too tight after measurement (Step 2).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Set up Docker
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver: docker
      - name: Install dependencies
        run: bun install
      - name: Build papai:e2e image
        run: docker build -t papai:e2e .
      - name: Run T2 smoke lane
        # Enforces the T2 measured wall-clock budget (Rule 5). The value below is the
        # measured lane time rounded up to ~2x headroom (see Step 2); it is a real
        # measurement, not a guess. host.docker.internal resolves via --add-host
        # (--add-host=host.docker.internal:host-gateway is set by the harness).
        timeout-minutes: 3
        run: bun run test:smoke

  # The mutation gate runs as plan -> k x shard -> gate. It was the CI wall clock as one job:
  # on run 33292465702 every other job finished in 5 minutes while this ran 73m21s, at 81% of a
  # 90-minute timeout. Work is linear in changed-file count (~107s/file over 252 measurements)
  # and each file is an independent Stryker process, so it divides cleanly.
  #
  # The matrix is sized from ESTIMATED WORK, not from a constant: below ~5.5 minutes of estimated
  # work the plan emits no shards at all and the gate runs on carried-over scores alone, so a
  # small pull request never spawns a matrix. See scripts/mutation/shard-sizing.ts.
  mutation-plan:
    name: Mutation Testing (plan)
    runs-on: ubuntu-latest
    # Selection and fingerprinting are free (0.2s median across 21 job logs); what this job can
    # actually spend is the coverage-map build, measured bimodal at 1.2s warm / 101.5s cold.
    timeout-minutes: 30
    if: ${{ github.event_name == 'pull_request' }}
    outputs:
      shards: ${{ steps.matrix.outputs.shards }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the runner needs the base branch to diff against
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Two caches with two different producers: the plan writes the coverage map, the gate
      # writes the scores. They were one entry when one job wrote both; `actions/cache` entries
      # are immutable per key, so splitting the producers means splitting the keys.
      - name: Restore coverage map
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/paired/coverage-map.cache.json
          key: mutation-coverage-v1-${{ github.event.pull_request.number }}-${{ github.sha }}-${{ github.run_id }}
          restore-keys: mutation-coverage-v1-${{ github.event.pull_request.number }}-
      - name: Restore carried-over mutation scores
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/paired/score-cache.json
          key: mutation-scores-v1-${{ github.event.pull_request.number }}-${{ github.sha }}-${{ github.run_id }}
          restore-keys: mutation-scores-v1-${{ github.event.pull_request.number }}-
      - name: Plan the run
        env:
          BASE_REF: ${{ github.base_ref || 'master' }}
        run: bun test:mutate:plan --base="origin/$BASE_REF"
      - name: Save coverage map
        if: always()
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/paired/coverage-map.cache.json
          key: mutation-coverage-v1-${{ github.event.pull_request.number }}-${{ github.sha }}-${{ github.run_id }}
      # An empty array skips the shard job entirely, which is exactly what a fully-reused or
      # below-threshold run should do. The gate still runs (`if: always()`) and still judges the
      # whole branch diff from the plan's carried-over scores.
      - name: Publish the matrix
        id: matrix
        run: |
          {
            echo "shards=$(jq -c '[.shards[].index]' reports/paired/shard-plan.json)"
            echo "count=$(jq -c '.shards | length' reports/paired/shard-plan.json)"
          } >> "$GITHUB_OUTPUT"
      - name: Upload the shard plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-shard-plan
          path: reports/paired/shard-plan.json
          retention-days: 14

  mutation-shard:
    name: Mutation Testing (shard ${{ matrix.index }})
    needs: mutation-plan
    if: ${{ needs.mutation-plan.outputs.count != '0' }}
    runs-on: ubuntu-latest
    # A shard carries at most one shard-budget of work, but the floor is the slowest single file
    # (5.6 min on the largest runs measured) and a wedged Stryker worker pool must not sit for
    # six hours. Sized well above the budget, far below the old whole-run ceiling.
    timeout-minutes: 45
    strategy:
      fail-fast: false # a dead shard must reach the gate as missing targets, not cancel its peers
      matrix:
        index: ${{ fromJSON(needs.mutation-plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      # Stryker's CLI host is Node (only the test children run on Bun), and Stryker 10 requires
      # Node >= 22 — pin it rather than inherit whatever Node the runner image ships.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Download the shard plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-shard-plan
          path: reports/paired
      # Shards measure; they never judge. The command exits 0 on a low score by design — a shard
      # that failed here would stop the gate from ever rendering the whole-branch verdict.
      - name: Measure this shard
        run: bun test:mutate:shard --index=${{ matrix.index }}
      - name: Upload this shard's results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-shard-result-${{ matrix.index }}
          path: reports/paired/shards/
          if-no-files-found: ignore
          retention-days: 14

  mutation-gate:
    name: Mutation Testing (gate)
    needs: [mutation-plan, mutation-shard]
    # `always()` rather than `success()`: a shard that crashed or timed out must still reach this
    # job, because a missing result is the failure the gate exists to catch. Skipping here on a
    # dead shard would drop its files from the per-file list, leave the ratchet nothing to fail
    # on, and turn a blocking gate green.
    if: ${{ always() && github.event_name == 'pull_request' && needs.mutation-plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # The gate is the sole writer of the score cache, so shards never race to write one key.
      - name: Restore carried-over mutation scores
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/paired/score-cache.json
          key: mutation-scores-v1-${{ github.event.pull_request.number }}-${{ github.sha }}-${{ github.run_id }}
          restore-keys: mutation-scores-v1-${{ github.event.pull_request.number }}-
      - name: Download the shard plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-shard-plan
          path: reports/paired
      - name: Download every shard result
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutation-shard-result-*
          merge-multiple: true
          path: reports/paired/shards
        continue-on-error: true # no results at all is a verdict the gate renders, not a setup error
      - name: Gate the whole branch diff
        run: bun test:mutate:gate
      - name: Save carried-over mutation scores
        # `always()` is load-bearing, not hygiene. A FAILING run must still persist the scores it
        # measured: otherwise the next push re-measures the regression from scratch and the gate
        # forgets the drop that made this run red. `continue-on-error` covers fork PRs, whose
        # read-only token cannot write a cache — a save that fails must never turn a green gate red.
        if: always()
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/paired/score-cache.json
          key: mutation-scores-v1-${{ github.event.pull_request.number }}-${{ github.sha }}-${{ github.run_id }}
      - name: Upload per-file mutation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-paired-reports
          path: reports/paired/
          if-no-files-found: ignore
          retention-days: 14

  mutation-baseline:
    name: Mutation Testing (changed-files baseline seed)
    runs-on: ubuntu-latest
    # Same tool and the same variance as the paired gate above, so the same value.
    # It matters more here than the runtime suggests: `queue: max` keeps every
    # merge's seed alive, so one wedged job at the six-hour ceiling stalls the
    # baseline queue behind it rather than just losing its own slot.
    timeout-minutes: 90
    # Serialize baseline seeds across CI runs. queue: max keeps every merge's job
    # alive: the default (single) lets a newer run cancel a pending one, which
    # would silently lose that merge's seed. Group is workflow-scoped because
    # concurrency groups are shared across all workflows in the repo.
    concurrency:
      group: ${{ github.workflow }}-mutation-baseline
      queue: max
    # On master merge: seed scripts/mutation/baseline.json with mutation scores for
    # changed files (broad scope) using seedMerge; existing entries are preserved
    # (per-key max), and first-touch files get seeded after merge. The committed
    # baseline is the floor the PR gate enforces.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # changed-files runner needs HEAD~1 (previous master) to diff against
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      # Same host pin as the PR gate: the Stryker 10 CLI needs Node >= 22.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Seed baseline from changed files since previous master
        run: bun test:mutate:changed --base=HEAD~1 --update-baseline
      - name: Commit ratcheted baseline
        env:
          RUN_SHA: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Master can move while mutation testing runs (e.g. a release bump push),
          # which rejects a naive push and loses the seed. Instead regenerate the
          # commit from the persisted scores on top of the fresh remote tip on every
          # attempt: seedMerge is per-key max, so retries never conflict and never
          # lose entries from concurrent seeds. --fresh-base drops scores for files
          # that changed on master since this run's checkout.
          for attempt in 1 2 3 4 5; do
            git fetch origin master
            git reset --hard origin/master
            bun test:mutate:seed --scores=reports/paired/scores.json --fresh-base="$RUN_SHA"
            if git diff --quiet scripts/mutation/baseline.json; then
              echo "No baseline change; nothing to commit."
              exit 0
            fi
            git add scripts/mutation/baseline.json
            git commit -m "chore(mutation): ratchet baseline"
            if git push; then
              exit 0
            fi
            echo "Push rejected because master moved; re-seeding on fresh master (attempt $attempt)."
          done
          echo "Failed to push ratcheted baseline after 5 attempts."
          exit 1
      - name: Upload changed-files mutation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-changed-files-reports
          path: reports/paired/
          if-no-files-found: ignore
