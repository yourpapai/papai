# Overlay for local integration tests.
# Exposes Kaneo to the host on KANEO_API_PORT (default 11337) so test
# scripts (test-provision.ts, test-migration.ts) can reach it at localhost.
services:
  kaneo:
    ports:
      - '${KANEO_API_PORT:-11337}:5173'
    # Limit memory to prevent OOM on the host system
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  caddy:
    deploy:
      replicas: 0

  papai:
    deploy:
      replicas: 0

  kaneo-postgres:
    # Limit memory to prevent OOM
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
