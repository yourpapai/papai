name: papai-analytics-openpanel-poc

services:
  op-proxy:
    image: caddy@sha256:fce4f15aad23222c0ac78a1220adf63bae7b94355d5ea28eee53910624acedfa
    restart: 'no'
    ports:
      - '127.0.0.1:4400:80'
    volumes:
      - op-proxy-data:/data
      - op-proxy-config:/config
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      op-dashboard:
        condition: service_healthy
      op-api:
        condition: service_healthy

  op-db:
    image: postgres@sha256:f1341c01408dc7278e9d365ed4f860cd3f87dd16b4464ac326fc0f422083a579
    restart: 'no'
    volumes:
      - op-db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 10

  op-kv:
    image: redis@sha256:6aaf3f5e6bc8a592fbfe2cccf19eb36d27c39d12dab4f4b01556b7449e7b1f44
    restart: 'no'
    command: ['redis-server', '--maxmemory-policy', 'noeviction']
    volumes:
      - op-kv-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping']
      interval: 10s
      timeout: 5s
      retries: 10

  op-ch:
    image: clickhouse/clickhouse-server@sha256:e019438e1e0539b0d1ce8380b628f1c06c5a0e641f368fc746acf4a8cf48d2f2
    restart: 'no'
    volumes:
      - op-ch-data:/var/lib/clickhouse
      - op-ch-logs:/var/log/clickhouse-server
      - ./clickhouse/clickhouse-config.xml:/etc/clickhouse-server/config.d/op-config.xml:ro
      - ./clickhouse/clickhouse-user-config.xml:/etc/clickhouse-server/users.d/op-user-config.xml:ro
      - ./clickhouse/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: '1'
    healthcheck:
      test: ['CMD-SHELL', "clickhouse-client --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  op-api:
    image: lindesvard/openpanel-api@sha256:9353647f96dcfcceecd0ba2efd4c05e77ace3ea3f5d56b2cef55c1c3b550be7c
    restart: 'no'
    command: >
      sh -c "
        CI=true pnpm -r run migrate:deploy
        pnpm start
      "
    env_file:
      - ${PAPAI_OPENPANEL_ENV_FILE:-.env}
    depends_on:
      op-db:
        condition: service_healthy
      op-ch:
        condition: service_healthy
      op-kv:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3000/healthcheck || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12

  op-dashboard:
    image: lindesvard/openpanel-dashboard@sha256:f6934fb35dabba990ca9e73253179494d2e0247fc4b96c8202adbbaa0f06833c
    restart: 'no'
    env_file:
      - ${PAPAI_OPENPANEL_ENV_FILE:-.env}
    depends_on:
      op-api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3000/api/healthcheck || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12

  op-worker:
    image: lindesvard/openpanel-worker@sha256:3f996a4f819a84a6ea90272a992fc025c4ad52d70b7612d65d666fafb2f83668
    restart: 'no'
    env_file:
      - ${PAPAI_OPENPANEL_ENV_FILE:-.env}
    depends_on:
      op-api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3000/healthcheck || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  op-db-data:
  op-kv-data:
  op-ch-data:
  op-ch-logs:
  op-proxy-data:
  op-proxy-config:
